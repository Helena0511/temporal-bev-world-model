[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-bev-world-model"
version = "0.1.0"
description = "Multi-view perception and trajectory planning based on a temporal BEV world model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy",
  "Pillow",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["resworld*"]
exclude = ["tests*", "scripts*", "docs*", "runs*", "weights*"]
